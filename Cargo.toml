[package]
name = "espal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
resolver = "2"

[[bin]]
name = "espal"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "=0.53.0"

[build-dependencies]
embuild = "=0.33.5"
