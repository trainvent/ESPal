[package]
name = "espal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
resolver = "2"

[[bin]]
name = "espal"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "=0.53.0"
espal-core = { path = "crates/espal-core" }
serde_json = "1"

[build-dependencies]
embuild = "=0.33.5"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "=1.6.1" }
bindings_header = "bindings.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-sr", version = "=2.0.5" }
bindings_header = "wake-bindings.h"
